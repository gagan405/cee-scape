name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Debug Build
        run: cargo build --verbose

      - name: Debug Tests
        run: cargo test --verbose

      - name: Release Build
        run: cargo build --release --verbose

      - name: Release Tests
        run: cargo test --release --verbose

  riscv64:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      # Cross-built binaries look for /lib/ld-linux-riscv64-lp64d.so.1; point QEMU at the sysroot.
      QEMU_LD_PREFIX: /usr/riscv64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: |
          rustup target add riscv64gc-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user qemu-user-binfmt

      - name: Debug Tests (riscv64)
        run: cargo test --target riscv64gc-unknown-linux-gnu --verbose

      - name: Release Tests (riscv64)
        run: cargo test --release --target riscv64gc-unknown-linux-gnu --verbose